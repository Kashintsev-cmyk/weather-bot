[project]
name = "weather-bot"
version = "0.2.0"
description = "Telegram weather bot with multi-source forecasts"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"

# Зависимости — в requirements.in / requirements.txt.

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["state", "logs", ".venv", ".venv310"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # длину строки определяет разработчик, а не линтер
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False в тестах допустим

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
